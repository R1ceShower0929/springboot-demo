server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: springboot-vue-demo

  # ===== 读写分离：dynamic-datasource =====
  # primary: master 表示默认走主库；标了 @DS("slave") 的方法才走从库
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_MASTER_HOST:127.0.0.1}:${MYSQL_MASTER_PORT:3306}/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:demo}
          password: ${MYSQL_PASSWORD:demo123456}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_SLAVE_HOST:127.0.0.1}:${MYSQL_SLAVE_PORT:3307}/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:demo}
          password: ${MYSQL_PASSWORD:demo123456}

  # ===== Redis 缓存 =====
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.demo: info

# ===== 健康检查（K8s 的 startup / readiness / liveness 探针都打这里）=====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never      # 不向外部暴露数据库、磁盘等内部细节
      probes:
        enabled: true          # 开启 /actuator/health/{liveness,readiness}
  info:
    env:
      enabled: true
  health:
    # 就绪探针只依赖数据库与 Redis：库连不上 = 未就绪，K8s 不会把流量导进来
    redis:
      enabled: true
    db:
      enabled: true